[project]
name = "sliceagent-core"
dynamic = ["version"]   # single-sourced from src/sliceagent_core/__init__.py
description = "The bounded-slice agent runtime — history-bounded, task-elastic reconstructed context. Reusable engine, no CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "TT-Wang" }]
keywords = ["agent-runtime", "llm", "context-engineering", "bounded-slice", "long-horizon"]
# The runtime is LLM-agnostic: a bare install drags in NOTHING. The built-in OpenAI-backed
# LLMClient (llm.py) imports its SDK lazily — install the extra only if you use it.
dependencies = []

[project.optional-dependencies]
openai = ["openai==3.6.0", "httpx==0.28.1"]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sliceagent_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sliceagent_core"]
