[project]
name = "sliceagent"
dynamic = ["version"]   # single-sourced from src/sliceagent/__init__.py (see [tool.hatch.version])
description = "A coding agent with history-bounded, task-elastic reconstructed context — built for long-horizon work."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TT-Wang" }]
keywords = ["coding-agent", "llm", "agent", "context-engineering", "context-management", "long-horizon", "memory", "cli", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
# Pi-style supply-chain policy: every DIRECT dependency is EXACT-pinned to the uv.lock tree
# (dependency changes are reviewed code changes, not ambient resolution). Guard: scripts/check_pinned_deps.py.
dependencies = [
    "openai==2.52.0",
    "httpx==0.28.1",
    "mcp==1.28.1",   # official MCP SDK — connect external MCP servers as tools (Step 3.3)
]

[project.optional-dependencies]
# Optional semantic index/legacy-vault bridge. Native typed knowledge, canonical evidence, Active Work, and
# history remain fully durable without this extra. No torch: SliceAgent uses Memem's BM25/FTS path.
memory = ["numpy>=1.24", "memem==2.9.7"]  # py-matrix: numpy keeps a range (pinning ==2.5.1 requires py>=3.12; the project supports 3.11)
# Precision upgrade for the RELATED CODE map's symbol graph (precise defs/refs, no regex
# false-positives). OPTIONAL: code_index._ts_def_names falls back to a regex when absent, so the
# graph map works without it. `pip install -e .[treesitter]`.
treesitter = ["tree-sitter==0.26.0", "tree-sitter-python==0.25.0"]
# Rich terminal UI: tool-call cards, inline diffs, status footer, slash palette, prompt_toolkit
# input (history/completion/ctrl-c-abort). OPTIONAL: the CLI falls back to plain print()+input()
# when absent (and when piped/headless, e.g. the eval). `pip install -e .[tui]`. Built on the
# rich+prompt_toolkit stack; plugs into the event-sink seam, never touches the moat.
tui = ["rich==15.0.0", "prompt_toolkit==3.0.52"]
# Dev toolchain: test runner + linter (CI installs `.[dev]`). `pip install -e .[dev]`.
dev = ["pytest==9.1.1", "ruff==0.15.21"]

[project.scripts]
sliceagent = "sliceagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sliceagent/__init__.py"   # the single version source (__version__)

[tool.hatch.build.targets.wheel]
packages = [
    "src/sliceagent",
    "packages/sliceagent-core/src/sliceagent_core",
    "packages/sliceagent-cli/src/sliceagent_cli",
]   # Model A: ONE published product; the wheel vendors both member packages.
    # pip never resolves the members (uv workspace is dev-only); publishing core
    # standalone is a future deliberate release, not blocked by this.

[tool.hatch.build.targets.sdist]
# sdist = source distribution; PyPI serves it to builders. Keep it lean: the wheel carries the
# runnable package, the sdist carries enough to rebuild + run offline tests. Eval caches/job artifacts remain
# VCS-ignored; only the small receipt A/B sources are versioned and therefore enter the sdist.
exclude = [
  "/docs/brand",
  "/prototype",
  "/brain",
  "/runs",
  "/scratch",
  "/.venv",
  "/.claude",
  "/.coverage",
  "/.mindmux",
  "/.pytest_cache",
  "/.ruff_cache",
  "*.pdf",
  "*.whl",
  "*.jsonl",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["prototype", "brain", "runs", "scratch", ".venv"]

[tool.ruff.lint]
# ruff's default real-bug set (E4 imports · E7 statements · E9 syntax · F pyflakes). NOT E5/E1/E2/W:
# the codebase deliberately uses long comment lines + dense formatting, so line-length/whitespace
# rules would be all noise. Lint for BUGS, not style.
select = ["E4", "E7", "E9", "F"]
# Deliberate house style, NOT bugs: E402 path-setup-before-import, E701/E702 terse one-liners
# (pervasive + intentional), E731 small local lambdas.
ignore = ["E402", "E701", "E702", "E731"]

[tool.ruff.lint.per-file-ignores]
# tests + eval scripts (not the shippable package): allow bound-but-unused intermediates + terse loop vars.
"tests/*" = ["F841", "E741"]
"evals/*" = ["F841", "E741"]

[tool.pytest.ini_options]
# Local eval caches contain copied third-party task suites. Product pytest collection is intentionally scoped
# to SliceAgent's own tests; benchmark runners execute their fixture tests inside isolated task environments.
testpaths = ["tests", "packages/sliceagent-core/tests", "packages/sliceagent-cli/tests"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sliceagent-core = { workspace = true }
sliceagent-cli = { workspace = true }
